<!DOCTYPE html>
<html>
<head>
  <title>AR Messenger</title>

  <style>
    body {
      margin:0;
      font-family:sans-serif;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    input,button {
      padding:10px;
      margin:5px;
    }

    #chat { display:none; }

    #messages {
      height:200px;
      overflow:auto;
      background:#1e293b;
      padding:10px;
    }

    .msg {
      background:#22c55e;
      margin:5px;
      padding:8px;
      border-radius:10px;
    }

    video { width:120px; }
  </style>
</head>

<body>

<h2>AR Messenger 😎🔥</h2>

<!-- LOGIN -->
<div id="authBox">
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- CHAT -->
<div id="chat">

<h3>👥 Users</h3>
<div id="users"></div>

<input id="friend" placeholder="Friend Email">
<button onclick="selectFriend()">Select Friend</button>

<h3>💬 Chat</h3>
<div id="messages"></div>

<input id="msg" placeholder="Type message">
<button onclick="send()">Send</button>
<button onclick="aiChat()">🤖 AI</button>

<br><br>

<!-- Voice -->
<button onclick="startRecording()">🎤</button>
<button onclick="stopRecording()">⏹</button>
<audio id="audioPlayer" controls></audio>

<br><br>

<!-- Location -->
<button onclick="sendLocation()">📍 Location</button>

<br><br>

<!-- Video -->
<button onclick="startVideo()">🎥 Video</button><br>
<video id="localVideo" autoplay muted></video>

<br><br>

<!-- Story -->
<input type="file" id="storyFile">
<button onclick="uploadStory()">Upload Story</button>
<div id="stories"></div>

<br><br>

<button onclick="logout()">Logout</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<script>

// 🔑 YOUR FIREBASE CONFIG বসাও
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let selectedFriend = "";

// REGISTER
function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(()=>alert("Account Created"));
}

// LOGIN
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .then(()=>{
    authBox.style.display="none";
    chat.style.display="block";

    setOnline();
    loadMessages();
    loadUsers();
    loadStories();
  });
}

// LOGOUT
function logout(){
  db.collection("users").doc(auth.currentUser.uid).update({online:false});
  auth.signOut();
  location.reload();
}

// ONLINE STATUS
function setOnline(){
  db.collection("users").doc(auth.currentUser.uid).set({
    email: auth.currentUser.email,
    online: true
  });
}

// LOAD USERS
function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    users.innerHTML="";
    snap.forEach(doc=>{
      let d = doc.data();
      users.innerHTML += <p>${d.email} ${d.online?"🟢":"⚫"}</p>;
    });
  });
}

// SELECT FRIEND
function selectFriend(){
  selectedFriend = friend.value;
  loadMessages();
}

// BAD WORD FILTER
const badWords = ["fuck","shit","xxx"];

function isClean(text){
  return !badWords.some(w => text.toLowerCase().includes(w));
}

// SEND MESSAGE
function send(){
  let text = msg.value;

  if(!isClean(text)){
    alert("Bad word!");
    return;
  }

  db.collection("messages").add({
    text,
    user: auth.currentUser.email,
    to: selectedFriend
  });
}

// LOAD MESSAGE
function loadMessages(){
  db.collection("messages").onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let d = doc.data();

      if(
        (d.user===auth.currentUser.email && d.to===selectedFriend) ||
        (d.user===selectedFriend && d.to===auth.currentUser.email)
      ){
        messages.innerHTML += <div class="msg"><b>${d.user}:</b> ${d.text}</div>;
      }
    });
  });
}

// AI CHAT
async function aiChat(){
  let text = msg.value;

  let res = await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer YOUR_API_KEY"
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"user",content:text}]
    })
  });

  let data = await res.json();
  messages.innerHTML += <div class="msg">AI: ${data.choices[0].message.content}</div>;
}

// VOICE
let recorder, chunks=[];

async function startRecording(){
  let stream = await navigator.mediaDevices.getUserMedia({audio:true});
  recorder = new MediaRecorder(stream);

  recorder.ondataavailable=e=>chunks.push(e.data);

  recorder.onstop=()=>{
    let blob = new Blob(chunks);
    audioPlayer.src = URL.createObjectURL(blob);
  };

  recorder.start();
}

function stopRecording(){
  recorder.stop();
}

// LOCATION
function sendLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    let link = https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude};

    db.collection("messages").add({
      text:"📍 "+link,
      user: auth.currentUser.email,
      to: selectedFriend
    });
  });
}

// VIDEO
async function startVideo(){
  let stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  localVideo.srcObject = stream;
}

// STORY
function uploadStory(){
  let file = storyFile.files[0];
  let ref = firebase.storage().ref("stories/"+Date.now());

  ref.put(file).then(()=>{
    ref.getDownloadURL().then(url=>{
      db.collection("stories").add({
        url,
        user: auth.currentUser.email
      });
    });
  });
}

function loadStories(){
  db.collection("stories").onSnapshot(snap=>{
    stories.innerHTML="";
    snap.forEach(doc=>{
      let d = doc.data();
      stories.innerHTML += <img src="${d.url}" width="60">;
    });
  });
}

</script>

</body>
</html>
